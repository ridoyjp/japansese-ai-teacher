<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#081c54"><title>Japanese Ai Ebook — Progress</title><style>
:root{font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;color:#fff;background:#06133d}button,a{font:inherit}.app{min-height:100dvh;position:relative;isolation:isolate;max-width:1350px;margin:auto;display:flex;flex-direction:column;overflow:hidden}.app:before{content:"";position:absolute;inset:0;z-index:-2;background:linear-gradient(180deg,rgba(3,10,48,.79),rgba(4,11,52,.62) 42%,rgba(6,11,49,.85)),url('assets/sakura-study-atmosphere.webp') center center/cover fixed no-repeat}.app:after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at 95% 30%,#ff51c128,transparent 36%)}.header{height:59px;display:flex;align-items:center;gap:12px;padding:8px clamp(12px,3vw,26px);background:#061b53b8;border-bottom:1px solid #8b8fff50;backdrop-filter:blur(15px)}.brand{font-weight:800;font-size:clamp(12px,2vw,18px);white-space:nowrap}.brand b{color:#ff5dba}.brand .book{filter:drop-shadow(0 0 8px #5ccaff);font-size:23px;vertical-align:middle}.nav{margin:auto;display:flex;gap:4px;align-items:center}.nav button,.lang,.back,.tab,.reset,.navbottom button{color:#fff;border:1px solid #a5a9ff55;background:#122b70a8;border-radius:999px;cursor:pointer;padding:8px 12px;transition:transform .2s,box-shadow .2s,background .2s}.nav button.active,.tab.active{background:linear-gradient(110deg,#ff4f9b,#dc2cb4);box-shadow:0 0 16px #fa3fa877;border-color:#ffafe3}.nav button:hover,.lang:hover,.back:hover,.tab:hover,.reset:hover,.navbottom button:hover{transform:translateY(-2px);box-shadow:0 0 20px #ff67d5a0}.lang{font-size:12px}.main{width:min(960px,100%);margin:0 auto;flex:1;padding:20px clamp(15px,4vw,36px) 90px}.back{border-radius:12px;padding:7px 12px}.headline{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 0 18px}.headline h1{font-size:clamp(20px,4vw,30px);margin:0}.subtitle{color:#cbdafa;font-size:13px;margin:4px 0}.pro{border:1px solid #ffce69;background:#6b3d72a6;border-radius:50px;padding:5px 10px;color:#ffe68e;font-size:11px}.overview{display:grid;grid-template-columns:minmax(0,1fr) 130px;gap:14px;align-items:center;padding:19px;border:1px solid #7da3ff85;border-radius:22px;background:linear-gradient(115deg,#0d286ecf,#16235fbb);box-shadow:0 12px 35px #03071f8a,inset 0 1px #fff3}.overview h2{margin:0 0 5px;font-size:clamp(17px,3vw,22px)}.overview p{margin:0;color:#cdddfc;font-size:13px}.ring{--p:35;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#18d9f9 calc(var(--p)*1%),#f649be calc(var(--p)*1%),#2a3c7e 0);padding:9px;box-shadow:0 0 26px #20c9ff5a;transition:background .3s}.ring-inner{width:100%;height:100%;border-radius:50%;background:#081b52;display:flex;align-items:center;justify-content:center;flex-direction:column}.ring strong{font-size:clamp(23px,5vw,34px)}.ring small{font-size:10px;color:#aeefff}.progress-list{margin-top:16px;display:grid;gap:12px}.progress-item{border:1px solid #799bff6b;border-radius:17px;background:linear-gradient(100deg,#10295bdb,#151a57db);padding:14px 16px;display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;box-shadow:0 8px 25px #0005;transition:transform .2s,border-color .2s}.progress-item:hover{transform:translateY(-3px);border-color:#ff8ce5}.symbol{height:44px;width:44px;display:grid;place-items:center;border-radius:12px;font-size:23px;background:linear-gradient(145deg,#ff6eae,#8c42dd);box-shadow:0 0 15px #ff62be55}.progress-item:nth-child(2) .symbol{background:linear-gradient(145deg,#39c8ff,#2552cc)}.progress-item:nth-child(3) .symbol{background:linear-gradient(145deg,#ffbd65,#eb5878)}.progress-item:nth-child(4) .symbol{background:linear-gradient(145deg,#ba67ff,#5e42dd)}.item-top{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:14px;font-weight:700}.item-top small{font-size:11px;color:#d3dcfc;font-weight:400;white-space:nowrap}.track{height:9px;margin-top:9px;background:#35416f;border-radius:20px;overflow:hidden}.fill{height:100%;border-radius:20px;width:0;background:linear-gradient(90deg,#ff6fbd,#fc42a5);transition:width .7s ease}.progress-item:nth-child(2) .fill{background:linear-gradient(90deg,#4ae0ff,#4880ff)}.progress-item:nth-child(3) .fill{background:linear-gradient(90deg,#ffc36c,#ff826d)}.progress-item:nth-child(4) .fill{background:linear-gradient(90deg,#c789ff,#7954f9)}.motivation{margin-top:18px;border:1px solid #ffb2e08c;background:linear-gradient(110deg,#e76b6066,#b23bb066);padding:15px;border-radius:18px;display:flex;align-items:center;gap:12px}.motivation span{font-size:30px}.motivation strong{font-size:14px}.motivation p{font-size:12px;margin:4px 0 0;color:#ffe6f7}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px}.reset{border-radius:12px;font-size:12px}.navbottom{position:sticky;bottom:0;background:#071843e8;backdrop-filter:blur(14px);border-top:1px solid #8a9df866;display:flex;justify-content:space-around;padding:8px 6px max(8px,env(safe-area-inset-bottom));gap:5px}.navbottom button{flex:1;max-width:160px;border-radius:12px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px}.navbottom span{font-size:21px}.navbottom .active{background:linear-gradient(135deg,#ee408e,#7b42d7)}.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#fff;color:#17305b;padding:10px 18px;border-radius:14px;box-shadow:0 8px 35px #0007;display:none;z-index:5;max-width:90%;text-align:center}@media(max-width:600px){.header{height:54px}.nav{display:none}.main{padding-top:14px}.overview{grid-template-columns:minmax(0,1fr) 102px;padding:14px}.ring{padding:7px}.progress-item{padding:12px;grid-template-columns:38px 1fr}.symbol{width:38px;height:38px;font-size:20px}.navbottom button{padding:7px 3px;font-size:11px}.lang{padding:7px 8px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body><div class="app"><header class="header"><div class="brand"><span class="book">📖</span> Japanese <b>Ai</b> Ebook</div><nav class="nav"><button onclick="go('home')">Home</button><button onclick="go('lessons')">Lessons</button><button onclick="go('ai')">AI Chat</button><button class="active">Progress</button></nav><button class="lang" onclick="changeLang()" id="lang">🇯🇵 日本語⌄</button></header><main class="main"><button class="back" onclick="goBack()">‹ Back</button><div class="headline"><div><h1>学習の進捗 <span style="color:#ff8dd7">✿</span></h1><p class="subtitle">Overall Progress · তোমার শেখার অগ্রগতি</p></div><span class="pro">👑 PRO</span></div><section class="overview"><div><h2>学習の進捗</h2><p id="completed">42 / 120 lessons</p><p style="margin-top:8px">毎日少しずつ、がんばろう！ 🌸</p></div><div class="ring" id="ring" style="--p:35"><div class="ring-inner"><strong id="percent">35%</strong><small>Completed</small></div></div></section><section class="progress-list" id="list"></section><section class="motivation"><span>🌸</span><div><strong>がんばっています！</strong><p>Keep going! You're doing great! 🌸</p></div></section><div class="actions"><button class="reset" onclick="increment()">＋ Mark one lesson completed</button><button class="reset" onclick="resetProgress()">↻ Reset demo progress</button></div></main><nav class="navbottom"><button onclick="go('home')"><span>⌂</span>Home</button><button onclick="go('lessons')"><span>▤</span>Lessons</button><button onclick="go('ai')"><span>🤖</span>AI Chat</button><button class="active"><span>▥</span>Progress</button></nav></div><div class="toast" id="toast" role="status"></div><script>
const sections=[{name:'Vocabulary & Kanji',icon:'🌸',done:12,total:50},{name:'Grammar & Reading',icon:'📘',done:8,total:40},{name:'Listening',icon:'🎧',done:6,total:30},{name:'Practice & Test',icon:'📝',done:4,total:20}];const key='japanese-ai-ebook-progress-demo-v1';let data;try{data=JSON.parse(localStorage.getItem(key))}catch(e){}if(!Array.isArray(data)||data.length!==4)data=sections.map(x=>x.done);function render(){document.getElementById('list').innerHTML=sections.map((s,i)=>`<article class="progress-item"><div class="symbol">${s.icon}</div><div><div class="item-top"><span>${s.name}</span><small>${data[i]} / ${s.total}</small></div><div class="track" role="progressbar" aria-label="${s.name}" aria-valuenow="${data[i]}" aria-valuemin="0" aria-valuemax="${s.total}"><div class="fill" style="width:${Math.round(data[i]/s.total*100)}%"></div></div></div></article>`).join('');const done=data.reduce((a,b)=>a+b,0),total=sections.reduce((a,b)=>a+b.total,0),p=Math.round(done/total*100);document.getElementById('completed').textContent=`${done} / ${total} lessons`;document.getElementById('percent').textContent=p+'%';document.getElementById('ring').style.setProperty('--p',p);localStorage.setItem(key,JSON.stringify(data))}render();function increment(){let i=data.findIndex((n,i)=>n<sections[i].total);if(i<0){toast('সব ডেমো লেসন শেষ! 🎉');return}data[i]++;render();toast('🌸 একটি লেসন সম্পন্ন হয়েছে')}function resetProgress(){if(confirm('ডেমো প্রগ্রেস আগের অবস্থায় ফেরত যাবে। চালিয়ে যাব?')){data=sections.map(s=>s.done);render()}}function toast(t){const el=document.getElementById('toast');el.textContent=t;el.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.style.display='none',2500)}function go(page){const paths={home:'../index.html',lessons:'../index.html#lessons',ai:'../Japanese_Ai_Ebook_Sixth_AI_Teacher_Page/index.html'};if(page==='progress')return;const target=paths[page];if(page==='ai'){location.href=target;return}toast('এই পৃষ্ঠা আলাদা ডেমো। সম্পূর্ণ প্রজেক্টে যুক্ত করলে '+page+' খুলবে।')}function goBack(){if(history.length>1)history.back();else toast('আগের পৃষ্ঠা পাওয়া যায়নি')}function changeLang(){const el=document.getElementById('lang');el.textContent=el.textContent.includes('日本語')?'🇧🇩 বাংলা⌄':'🇯🇵 日本語⌄'}
</script><script>
(function(){
 const map={'home':'home','lessons':'lessons','lesson':'lessons','vocabulary':'vocabulary','vocabulary & kanji':'vocabulary','grammar':'grammar','grammar & reading':'grammar','reading':'grammar','listening':'listening','practice':'lessons','practice & test':'lessons','ai':'ai','ai chat':'ai','ai teacher':'ai','progress':'progress'};
 const navigate=(label)=>{const page=map[String(label).toLowerCase()];if(page){window.parent.postMessage({japaneseEbookNav:page},'*');return true;}return false};
 window.go=function(label){if(!navigate(label))console.info('Unlinked action:',label)};
 window.nav=function(label){if(!navigate(label))console.info('Unlinked action:',label)};
 window.goBack=function(){window.parent.postMessage({japaneseEbookBack:true},'*')};
 document.addEventListener('click',function(e){const button=e.target.closest('button,a');if(!button)return;const raw=button.getAttribute('onclick')||'';if(/history\.back\(\)|location\.href='index\.html'/.test(raw)){e.preventDefault();e.stopImmediatePropagation();window.parent.postMessage({japaneseEbookBack:true},'*')}},true);
 document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.activeElement?.tagName!=='INPUT')window.parent.postMessage({japaneseEbookBack:true},'*')});
})();
</script></body></html>
