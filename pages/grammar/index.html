const data=[{level:'N5',jp:'～は (wa)',en:'Topic Marker',desc:'Used to indicate the topic of a sentence.',explain:'「は (wa)」は、文の話題を示す助詞です。 / 「は (wa)」 is used to indicate the topic of a sentence. বাংলায় বাক্যের আলোচ্য বিষয় বোঝায়।',sound:'わたしは学生です',ex:[['私は学生です。','Watashi wa gakusei desu.','I am a student.'],['これは本です。','Kore wa hon desu.','This is a book.'],['今日は暑いです。','Kyou wa atsui desu.','Today is hot.']]},{level:'N5',jp:'～です (Desu)',en:'Polite form of to be',desc:'Used in formal speech.',explain:'「です」 বাক্যকে ভদ্রভাবে শেষ করতে ব্যবহৃত হয়। It is a polite sentence ending often used with nouns and adjectives.',sound:'これは本です',ex:[['私はリドイです。','Watashi wa Ridoi desu.','I am Ridoy.'],['これはペンです。','Kore wa pen desu.','This is a pen.']]},{level:'N5',jp:'～ます (Masu Form)',en:'Polite verb form',desc:'Polite verb form for actions.',explain:'「ます」 ক্রিয়ার ভদ্র রূপ বোঝায়। Attach ます to a verb stem to speak politely.',sound:'まいにち日本語を勉強します',ex:[['毎日勉強します。','Mainichi benkyou shimasu.','I study every day.'],['水を飲みます。','Mizu o nomimasu.','I drink water.']]},{level:'N5',jp:'～の (Possessive)',en:'Shows possession or connection.',desc:'Connects nouns to show belonging.',explain:'「の」 মালিকানা বা দুটি বিশেষ্যের সম্পর্ক বোঝায়। It is used like English “of” or possessive “’s”.',sound:'わたしの本',ex:[['私の本です。','Watashi no hon desu.','It is my book.'],['日本語の先生です。','Nihongo no sensei desu.','A Japanese teacher.']]},{level:'N4',jp:'～と思います',en:'I think that…',desc:'Expressing your opinion.',explain:'「と思います」 দিয়ে নিজের মতামত বা ধারণা প্রকাশ করা হয়।',sound:'いいと思います',ex:[['いいと思います。','Ii to omoimasu.','I think it is good.']]},{level:'N3',jp:'～ように',en:'So that / in order to',desc:'Express purpose or desired result.',explain:'「ように」 কাঙ্ক্ষিত ফল বা উদ্দেশ্য বোঝাতে ব্যবহৃত হয়।',sound:'わかるように話します',ex:[['わかるように話します。','Wakaru you ni hanashimasu.','I speak so you can understand.']]},{level:'N2',jp:'～わけではない',en:'It does not mean that…',desc:'Partial negation.',explain:'「わけではない」 দিয়ে বোঝায় যে কোনো কথা সব ক্ষেত্রে সত্য নয়।',sound:'きらいなわけではない',ex:[['嫌いなわけではない。','Kirai na wake dewa nai.','It does not mean I dislike it.']]},{level:'N1',jp:'～に至るまで',en:'Even as far as…',desc:'Indicates an extensive range.',explain:'「に至るまで」 কোনো সীমা বা পরিসরের শেষ প্রান্ত পর্যন্ত বোঝায়।',sound:'すみずみにいたるまで',ex:[['隅々に至るまで調べた。','Sumizumi ni itaru made shirabeta.','I examined every last corner.']]}];let level='All',selected=0;const levels=['All','N5','N4','N3','N2','N1'];function current(){return data[selected]}function visible(){let q=document.getElementById('search').value.toLowerCase();return data.map((v,i)=>({...v,i})).filter(v=>(level==='All'||v.level===level)&&(`${v.jp} ${v.en} ${v.desc}`.toLowerCase().includes(q)))}function render(){document.getElementById('filters').innerHTML=levels.map(l=>`<button class="${l===level?'active':''}" onclick="setLevel('${l}')">${l}</button>`).join('');let arr=visible();if(arr.length&&!arr.some(x=>x.i===selected))selected=arr[0].i;document.getElementById('list').innerHTML=arr.length?arr.map((x,n)=>`<button class="item ${x.i===selected?'active':''}" onclick="selectItem(${x.i})"><span class="thumb">${['⛩️','🌸','🗻','🏯'][n%4]}</span><span><strong>${x.jp}</strong><small>${x.en}</small><small>${x.desc}</small></span><span><span class="badge">${x.level}</span> <span class="arrow">›</span></span></button>`).join(''):'<p>No grammar found.</p>';let v=current();document.getElementById('grammar-title').textContent=v.jp;document.getElementById('grammar-subtitle').textContent=v.en;document.getElementById('explanation').textContent=v.explain;document.getElementById('examples').innerHTML=v.ex.map(x=>`<div class="example"><button aria-label="Play Japanese sentence" onclick="speak('${x[0]}')">◖))</button><div><strong>${x[0]}</strong><small>${x[1]}</small><small>${x[2]}</small></div></div>`).join('')}function setLevel(l){level=l;render()}function selectItem(i){selected=i;render()}function move(step){let a=visible();let idx=a.findIndex(x=>x.i===selected);if(!a.length)return;selected=a[(idx+step+a.length)%a.length].i;render()}function speak(t){if(!('speechSynthesis'in window)){toast('Speech is unavailable in this browser');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';u.rate=.82;u.volume=1;speechSynthesis.speak(u)}function toast(s){let e=document.getElementById('notice');e.textContent=s;e.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>e.style.display='none',2600)}function go(s){toast(s+' page will be connected when you combine all pages into the full project.')}render();
