<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Japanese Ai Ebook — Listening Practice</title><style>
:root{font-family:Inter,system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#fff;--pink:#ff3da6;--blue:#1579f9}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:#061443;overflow-x:hidden}body:before{content:"";position:fixed;inset:-25px;z-index:-2;background:linear-gradient(100deg,#06134a70,#061b5870),url('assets/reference.png') center/cover no-repeat;filter:blur(13px) saturate(1.5);transform:scale(1.04)}body:after{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 92% 15%,#ff299c4d,transparent 32%),linear-gradient(180deg,#00144855,#031035c9)}button,select{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #a9faff;outline-offset:3px}.shell{max-width:1480px;margin:auto;min-height:100dvh;padding:10px 20px 26px}.topbar{display:flex;align-items:center;gap:18px;min-height:51px;padding:5px 16px;border:1px solid #529bff66;background:#061f5caa;backdrop-filter:blur(18px);border-radius:24px;box-shadow:0 0 20px #1988ff50}.brand{font-weight:850;white-space:nowrap;text-shadow:0 0 15px #9acbff}.brand em{color:#ff71b9;font-style:normal}.logo{font-size:25px}.topnav{display:flex;align-items:center;gap:7px;justify-content:center;flex:1}.topnav button,.pill{color:#e7edff;border:1px solid #5384d364;background:#092c72ad;border-radius:999px;padding:8px 18px;transition:.22s}.topnav button.active,.pill.active{background:linear-gradient(110deg,#ff60a6,#ed188f);box-shadow:0 0 15px #ff40a9b0;color:white;border-color:#ffb9e0}.topnav button:hover,.pill:hover,.iconbtn:hover,.track:hover,.round:hover,.arrow:hover{transform:translateY(-2px);filter:brightness(1.25);box-shadow:0 0 17px #f938b17d}.rightnav{display:flex;gap:8px;align-items:center}.iconbtn{border:1px solid #6288e0a1;border-radius:50%;background:#08245eb9;color:#fff;width:38px;height:38px;transition:.2s}.layout{display:grid;grid-template-columns:77px minmax(0,1fr);gap:14px;margin-top:14px}.sidebar{border:1px solid #478aff44;background:#041744bd;border-radius:18px;display:flex;flex-direction:column;gap:7px;padding:11px 6px;align-self:start}.side{border:0;border-radius:13px;background:transparent;color:#cddaff;padding:9px 3px;display:flex;align-items:center;flex-direction:column;gap:3px;font-size:11px;transition:.2s}.side span{font-size:20px}.side.active,.side:hover{background:linear-gradient(120deg,#f44ba2,#af2ce4);color:white;box-shadow:0 0 18px #fa4aa55e}.content{min-width:0}.heading{display:flex;justify-content:space-between;align-items:center;margin:3px 0 13px}.heading h1{margin:0;font-size:clamp(22px,2.8vw,34px);text-shadow:0 2px 12px #0008}.heart{color:#ff78bd}.level{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.pill{padding:7px 17px;font-size:13px}.columns{display:grid;grid-template-columns:minmax(245px,.92fr) minmax(320px,1.18fr);gap:18px}.panel{border:1px solid #8b9fff7a;border-radius:22px;background:linear-gradient(135deg,#0c2a72d9,#071a52e8);box-shadow:0 10px 40px #010827a0,inset 0 1px #ffffff22;backdrop-filter:blur(14px);padding:13px}.track{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:linear-gradient(95deg,#123b87e0,#0a205ac9);border:1px solid #5299ef82;color:white;border-radius:14px;padding:10px;margin-bottom:9px;transition:.2s}.track.selected{border-color:#ff92d4;background:linear-gradient(95deg,#f73e9e88,#113f8cd9);box-shadow:0 0 16px #ff4aa65c}.round{width:42px;height:42px;flex-shrink:0;border:1px solid #ffffffaa;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#00c9f9,#1683fc);box-shadow:0 0 13px #08aef4a6;transition:.2s}.track:nth-child(3n) .round{background:linear-gradient(130deg,#ffa94c,#fa478c)}.track:nth-child(4n) .round{background:linear-gradient(130deg,#a454ff,#ed3cb7)}.track-info{flex:1;min-width:0}.track-info strong,.track-info small,.track-info span{display:block}.track-info strong{font-size:15px}.track-info small{font-size:12px;color:#d4ddff}.track-info span{font-size:12px;color:#a9c9ff}.arrow{border:1px solid #829de28c;border-radius:50%;width:32px;height:32px;background:#ffffff16;color:white;transition:.2s}.art{height:clamp(160px,22vw,285px);border-radius:15px;background:linear-gradient(180deg,#08144300,#041b5d77),url('assets/reference.png') 84% 38%/cover no-repeat;display:grid;place-items:center;position:relative;overflow:hidden;border:1px solid #ffabdc66}.art:after{content:'🌸 ✨ 🌸';position:absolute;bottom:9px;right:12px;opacity:.85}.bigplay{width:80px;height:80px;border-radius:50%;border:2px solid #ffc5e6;background:linear-gradient(135deg,#ff75b5,#f7198e);color:white;font-size:31px;box-shadow:0 0 26px #ff4eabd9;transition:.2s}.bigplay:hover{transform:scale(1.09)}.details{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:13px 0}.details h2{margin:0;font-size:19px}.details p{margin:3px 0 0;color:#c6d9ff;font-size:13px}.speed{background:#0c2b70;border:1px solid #5d90ec;border-radius:10px;color:white;padding:7px}.seek{width:100%;accent-color:#ff45ab;cursor:pointer}.times{display:flex;justify-content:space-between;font-size:12px;color:#cbd8ff}.controls{display:flex;gap:10px;align-items:center;justify-content:center;margin:14px 0}.controls button{border:1px solid #9db9ff7d;border-radius:999px;background:#103d87;color:white;padding:9px 16px;transition:.2s}.controls .pink{background:linear-gradient(120deg,#ff64b3,#ec188c);border-color:#ffd2ed}.volume{display:flex;align-items:center;gap:10px;font-size:13px;color:#dce8ff}.volume input{flex:1;min-width:30px;accent-color:#fa48a7}.script{background:#06143fb8;border:1px solid #7294d85d;border-radius:13px;padding:13px;margin-top:14px}.script h3{margin:0 0 10px;font-size:15px;color:#e1eaff}.script .jp{font-size:19px;font-weight:750;margin:0 0 5px}.script .roman{font-size:13px;color:#c0d8ff;margin:0 0 6px}.script .meaning{font-size:14px;color:#f4d7f2;margin:0}.footer{font-size:12px;color:#d1d9fa;margin-top:14px}.notice{margin-top:10px;min-height:20px;font-size:12px;color:#f6d8ed}@media(max-width:760px){.shell{padding:8px 9px 22px}.topbar{gap:7px;padding:6px 9px;flex-wrap:wrap}.brand{font-size:13px}.logo{font-size:19px}.topnav{order:3;width:100%;overflow:auto;justify-content:flex-start}.topnav button{padding:7px 12px;white-space:nowrap;font-size:12px}.rightnav{margin-left:auto}.layout{grid-template-columns:51px minmax(0,1fr);gap:7px}.sidebar{padding:7px 3px}.side{font-size:9px}.side span{font-size:16px}.columns{grid-template-columns:1fr;gap:12px}.heading h1{font-size:22px}.pill{padding:7px 12px}.art{height:230px}.panel{padding:10px}.track{padding:8px}.track-info strong{font-size:13px}}@media(max-width:390px){.brand{font-size:12px}.topbar .rightnav .iconbtn:last-child{display:none}.layout{grid-template-columns:43px minmax(0,1fr)}.side{font-size:8px}.side span{font-size:15px}.level{gap:4px}.pill{font-size:11px;padding:6px 9px}}
</style></head><body><div class="shell"><header class="topbar"><div class="brand"><span class="logo">📖</span> Japanese <em>Ai</em> Ebook</div><nav class="topnav" aria-label="Top navigation"><button onclick="go('Home')">Home</button><button class="active" onclick="go('Lessons')">Lessons</button><button onclick="go('AI Chat')">AI Chat</button><button onclick="go('Progress')">Progress</button></nav><div class="rightnav"><button class="iconbtn" onclick="document.getElementById('search').hidden=!document.getElementById('search').hidden" aria-label="Search">⌕</button><button class="iconbtn" onclick="toggleLang()" aria-label="Language">🇯🇵</button></div></header><input id="search" hidden placeholder="Search tracks..." aria-label="Search tracks" style="margin:10px 0;width:100%;padding:11px;border-radius:12px;border:1px solid #81a8ef;background:#102b68;color:white" oninput="render()"><div class="layout"><aside class="sidebar"><button class="side" onclick="go('Home')"><span>⌂</span>Home</button><button class="side" onclick="go('Lessons')"><span>▣</span>Lessons</button><button class="side" onclick="go('Vocabulary')"><span>▤</span>Vocabulary</button><button class="side" onclick="go('Grammar')"><span>▧</span>Grammar</button><button class="side active" onclick="go('Listening')"><span>🎧</span>Listening</button><button class="side" onclick="go('Practice')"><span>☑</span>Practice</button><button class="side" onclick="go('AI Chat')"><span>♧</span>AI Chat</button><button class="side" onclick="go('Progress')"><span>♧</span>Progress</button></aside><main class="content"><div class="heading"><h1>Listening Practice <span class="heart">♥</span></h1><span style="font-size:12px;color:#e2c9ef">日本語 • 聞き取り</span></div><div class="level" id="levels"></div><div class="columns"><section class="panel" aria-label="Listening tracks"><div id="tracks"></div><div class="footer">🎧 Select a track to listen and practice Japanese.</div></section><section class="panel" aria-label="Audio player"><div class="art"><button class="bigplay" id="bigplay" onclick="togglePlay()" aria-label="Play or pause">▶</button></div><div class="details"><div><h2 id="trackTitle">日常のあいさつ</h2><p id="trackSub">Daily Greetings</p></div><select class="speed" id="speed" onchange="updateRate()" aria-label="Playback speed"><option value="0.7">0.7×</option><option value="0.85">0.85×</option><option value="1" selected>1.0×</option><option value="1.2">1.2×</option><option value="1.5">1.5×</option></select></div><input class="seek" type="range" id="seek" min="0" max="100" value="0" oninput="seekTo(this.value)" aria-label="Playback position"><div class="times"><span id="elapsed">0:00</span><span id="duration">0:00</span></div><div class="controls"><button onclick="step(-1)">← Previous</button><button class="pink" id="playbtn" onclick="togglePlay()">▶ Play</button><button onclick="step(1)">Next →</button></div><div class="volume"><span>🔊 Volume</span><input id="volume" type="range" min="0" max="100" value="100" aria-label="Volume" oninput="setVolume(this.value)"><span id="volumeValue">100%</span></div><div class="script"><h3>✎ スクリプト Script</h3><p class="jp" id="jp"></p><p class="roman" id="romaji"></p><p class="meaning" id="meaning"></p></div><div class="notice" id="notice" aria-live="polite"></div></section></div></main></div></div><script>
const tracks=[{level:'N5',jp:'日常のあいさつ',en:'Daily Greetings',line:'おはようございます。こんにちは。こんばんは。',romaji:'Ohayou gozaimasu. Konnichiwa. Konbanwa.',bn:'সুপ্রভাত। নমস্কার। শুভ সন্ধ্যা।'},{level:'N5',jp:'自己紹介',en:'Self Introduction',line:'はじめまして。わたしはリドイです。よろしくおねがいします。',romaji:'Hajimemashite. Watashi wa Ridoi desu. Yoroshiku onegaishimasu.',bn:'পরিচিত হয়ে ভালো লাগল। আমি রিদয়। আপনার সহযোগিতা কামনা করছি।'},{level:'N5',jp:'買い物',en:'Shopping',line:'これはいくらですか。これをください。ありがとうございます。',romaji:'Kore wa ikura desu ka. Kore o kudasai. Arigatou gozaimasu.',bn:'এটার দাম কত? এটা দিন। অনেক ধন্যবাদ।'},{level:'N5',jp:'レストラン',en:'Restaurant',line:'メニューをください。水をお願いします。おいしいです。',romaji:'Menyuu o kudasai. Mizu o onegaishimasu. Oishii desu.',bn:'মেনু দিন। পানি দিন। সুস্বাদু।'},{level:'N4',jp:'駅での会話',en:'At the Station',line:'すみません。東京駅はどこですか。まっすぐ行ってください。',romaji:'Sumimasen. Toukyou eki wa doko desu ka. Massugu itte kudasai.',bn:'মাফ করবেন। টোকিও স্টেশন কোথায়? সোজা যান।'},{level:'N3',jp:'旅行の予定',en:'Travel Plans',line:'来週、友だちと京都へ旅行する予定です。',romaji:'Raishuu, tomodachi to Kyouto e ryokou suru yotei desu.',bn:'আগামী সপ্তাহে বন্ধুর সঙ্গে কিয়োটো ভ্রমণের পরিকল্পনা আছে।'},{level:'N2',jp:'仕事の相談',en:'Work Discussion',line:'この件について、明日の会議で詳しく説明します。',romaji:'Kono ken ni tsuite, ashita no kaigi de kuwashiku setsumei shimasu.',bn:'এই বিষয়টি আগামীকালের মিটিংয়ে বিস্তারিত ব্যাখ্যা করব।'},{level:'N1',jp:'社会と文化',en:'Society and Culture',line:'異文化を理解するには、相手の価値観を尊重することが欠かせません。',romaji:'Ibunka o rikai suru ni wa, aite no kachikan o sonchou suru koto ga kakasemasen.',bn:'ভিন্ন সংস্কৃতি বুঝতে অন্যের মূল্যবোধকে সম্মান করা অপরিহার্য।'}];let level='All',current=0,playing=false,utterance=null,startTime=0,tick=null,elapsed=0,estimated=0;const $=id=>document.getElementById(id);function visible(){let q=$('search').value.toLowerCase();return tracks.map((t,i)=>({...t,i})).filter(t=>(level==='All'||t.level===level)&&(`${t.jp} ${t.en} ${t.romaji} ${t.bn}`.toLowerCase().includes(q)))}function render(){const levels=['All','N5','N4','N3','N2','N1'];$('levels').innerHTML=levels.map(x=>`<button class="pill ${level===x?'active':''}" onclick="filter('${x}')">${x}</button>`).join('');$('tracks').innerHTML=visible().map((t,n)=>`<button class="track ${current===t.i?'selected':''}" onclick="choose(${t.i})"><span class="round">${current===t.i&&playing?'Ⅱ':'▶'}</span><span class="track-info"><strong>Track ${n+1}　${t.jp}</strong><small>${t.en}</small><span>${t.level} · Listening</span></span><span class="arrow">›</span></button>`).join('')||'<p>No matching tracks.</p>';showTrack()}function showTrack(){let t=tracks[current];$('trackTitle').textContent=t.jp;$('trackSub').textContent=t.en+' · '+t.level;$('jp').textContent=t.line;$('romaji').textContent=t.romaji;$('meaning').textContent=t.bn;estimated=Math.max(5,Math.ceil(t.line.length/5));$('duration').textContent=fmt(estimated);$('elapsed').textContent=fmt(elapsed);$('seek').value=estimated?Math.min(100,elapsed/estimated*100):0;updateButtons()}function filter(x){level=x;let v=visible();if(v.length&&!v.some(t=>t.i===current))choose(v[0].i);else render()}function choose(i){stop();current=i;render()}function fmt(n){return `${Math.floor(n/60)}:${String(Math.floor(n%60)).padStart(2,'0')}`}function updateButtons(){$('bigplay').textContent=playing?'Ⅱ':'▶';$('playbtn').textContent=playing?'Ⅱ Pause':'▶ Play'}function stop(){speechSynthesis.cancel();clearInterval(tick);playing=false;elapsed=0;updateButtons()}function togglePlay(){if(playing){speechSynthesis.cancel();clearInterval(tick);playing=false;updateButtons();$('notice').textContent='Paused. Press Play to listen again.';return}if(!('speechSynthesis'in window)){$('notice').textContent='Speech synthesis is not available in this browser.';return}speechSynthesis.cancel();const t=tracks[current];utterance=new SpeechSynthesisUtterance(t.line);utterance.lang='ja-JP';utterance.rate=Number($('speed').value);utterance.volume=Number($('volume').value)/100;let voices=speechSynthesis.getVoices();let ja=voices.find(v=>v.lang.toLowerCase().startsWith('ja'));if(ja)utterance.voice=ja;playing=true;elapsed=0;updateButtons();render();startTime=Date.now();tick=setInterval(()=>{if(playing){elapsed=Math.min(estimated,(Date.now()-startTime)/1000);$('elapsed').textContent=fmt(elapsed);$('seek').value=Math.min(100,elapsed/estimated*100)}},250);utterance.onend=()=>{clearInterval(tick);playing=false;elapsed=estimated;showTrack();$('notice').textContent='✓ Listening finished!'};utterance.onerror=()=>{clearInterval(tick);playing=false;updateButtons();$('notice').textContent='Audio could not play. Try Chrome or Safari.'};speechSynthesis.speak(utterance);$('notice').textContent='🔊 Playing Japanese pronunciation using your device voice.'}function step(d){let v=visible();let p=v.findIndex(t=>t.i===current);if(!v.length)return;choose(v[(p+d+v.length)%v.length].i)}function setVolume(v){$('volumeValue').textContent=v+'%';if(playing){stop();$('notice').textContent='Volume updated. Press Play to restart.'}}function updateRate(){if(playing){stop();$('notice').textContent='Speed updated. Press Play to restart.'}}function seekTo(v){$('seek').value=0;$('notice').textContent='Browser text-to-speech cannot seek. Use Previous/Next or Play to restart.'}function go(page){$('notice').textContent=page+' page is part of the full project. This download is the Listening page prototype.'}function toggleLang(){$('notice').textContent='Japanese audio · বাংলা explanations enabled.'}render();
</script><script>
(function(){
 const map={'home':'home','lessons':'lessons','lesson':'lessons','vocabulary':'vocabulary','vocabulary & kanji':'vocabulary','grammar':'grammar','grammar & reading':'grammar','reading':'grammar','listening':'listening','practice':'lessons','practice & test':'lessons','ai':'ai','ai chat':'ai','ai teacher':'ai','progress':'progress'};
 const navigate=(label)=>{const page=map[String(label).toLowerCase()];if(page){window.parent.postMessage({japaneseEbookNav:page},'*');return true;}return false};
 window.go=function(label){if(!navigate(label))console.info('Unlinked action:',label)};
 window.nav=function(label){if(!navigate(label))console.info('Unlinked action:',label)};
 window.goBack=function(){window.parent.postMessage({japaneseEbookBack:true},'*')};
 document.addEventListener('click',function(e){const button=e.target.closest('button,a');if(!button)return;const raw=button.getAttribute('onclick')||'';if(/history\.back\(\)|location\.href='index\.html'/.test(raw)){e.preventDefault();e.stopImmediatePropagation();window.parent.postMessage({japaneseEbookBack:true},'*')}},true);
 document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.activeElement?.tagName!=='INPUT')window.parent.postMessage({japaneseEbookBack:true},'*')});
})();
</script></body></html>
