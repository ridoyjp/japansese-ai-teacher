3{left:24%;top:88%;animation-delay:-4s}@keyframes float{50%{transform:translateY(-19px) rotate(45deg);opacity:1}}@keyframes glowspin{50%{filter:hue-rotate(110deg);box-shadow:0 0 35px var(--glow),0 0 45px #fff7}}.page{position:fixed;inset:0;background:#06133a}.page iframe{width:100%;height:100%;border:0;display:block}.back{position:fixed;right:16px;bottom:16px;z-index:9;background:linear-gradient(100deg,#fc349a,#7829cc);border:1px solid #ffd1f3;border-radius:40px;padding:12px 18px;font-weight:850;box-shadow:0 0 20px #f932a7a1}

<script>const paths={lessons:'pages/lessons/index.html',vocabulary:'pages/vocabulary/index.html',grammar:'pages/grammar/index.html',listening:'pages/listening/index.html',ai:'pages/ai/index.html',progress:'pages/progress/index.html'};const home=document.getElementById('home'),page=document.getElementById('page'),view=document.getElementById('view');let current='home';function show(route){if(route!=='home'&&!paths[route])route='lessons';current=route;const isHome=route==='home';home.hidden=!isHome;page.hidden=isHome;home.style.display=isHome?'':'none';page.style.display=isHome?'none':'block';if(!isHome&&view.getAttribute('src')!==paths[route])view.setAttribute('src',paths[route]);window.scrollTo(0,0)}function openPage(route){if(!route||route===current)return;history.pushState({route},'',route==='home'?location.pathname:'#'+route);show(route)}function backPage(){if(history.state?.route&&history.length>1)history.back();else openPage('home')}window.addEventListener('popstate',e=>show(e.state?.route||location.hash.slice(1)||'home'));window.addEventListener('message',e=>{if(e.source!==view.contentWindow)return;if(e.data?.japaneseEbookNav)openPage(e.data.japaneseEbookNav);if(e.data?.japaneseEbookBack)backPage()});const initial=location.hash.slice(1);history.replaceState({route:paths[initial]?initial:'home'},'',location.href);show(paths[initial]?initial:'home');</script></body></html>
